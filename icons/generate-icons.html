<!DOCTYPE html>
<html>
<head>
<title>Fenie Icon Generator</title>
<style>
  body { background: #0a0a1a; color: #eee; font-family: Arial, sans-serif; padding: 24px; }
  h2 { color: #00d4ff; margin-bottom: 8px; }
  p { color: #888; margin-bottom: 20px; }
  button {
    background: linear-gradient(135deg, #00c8ff, #0088cc);
    color: #fff; border: none; padding: 13px 32px;
    font-size: 15px; font-weight: 700; border-radius: 10px;
    cursor: pointer; margin-top: 20px; letter-spacing: 0.5px;
    box-shadow: 0 0 20px rgba(0,200,255,0.3);
  }
  button:hover { opacity: 0.9; }
  .previews { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
  .preview-box { text-align: center; }
  .preview-box p { font-size: 11px; color: #555; margin-top: 6px; }
</style>
</head>
<body>
<h2>Fenie Icon Generator</h2>
<p>Preview below. Click Generate to download all icon sizes.</p>
<div class="previews" id="previews"></div>
<button id="generate">Generate &amp; Download All Icons</button>

<script>
function drawFenie(ctx, size) {
  const s = size;
  const r = s * 0.22;

  ctx.clearRect(0, 0, s, s);

  // ── Outer glow shadow ──
  ctx.save();
  roundRect(ctx, 0, 0, s, s, r);
  ctx.shadowColor = 'rgba(0,220,255,0.9)';
  ctx.shadowBlur = s * 0.12;
  ctx.fillStyle = 'rgba(0,220,255,0.0)';
  ctx.fill();
  ctx.restore();

  // ── Background ──
  ctx.save();
  roundRect(ctx, 0, 0, s, s, r);
  const bg = ctx.createLinearGradient(0, 0, s, s);
  bg.addColorStop(0, '#0b1a35');
  bg.addColorStop(0.5, '#0d1e3d');
  bg.addColorStop(1, '#081426');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.restore();

  // ── Teal outer glow border ──
  ctx.save();
  roundRect(ctx, s * 0.025, s * 0.025, s * 0.95, s * 0.95, r * 0.88);
  ctx.strokeStyle = 'rgba(0,220,255,0.85)';
  ctx.lineWidth = s * 0.038;
  ctx.shadowColor = 'rgba(0,220,255,1)';
  ctx.shadowBlur = s * 0.1;
  ctx.stroke();
  ctx.restore();

  // ── Clip to rounded rect ──
  ctx.save();
  roundRect(ctx, 0, 0, s, s, r);
  ctx.clip();

  // Inner radial glow (center-left)
  const iglow = ctx.createRadialGradient(s*0.38, s*0.5, 0, s*0.38, s*0.5, s*0.55);
  iglow.addColorStop(0, 'rgba(0,80,180,0.35)');
  iglow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = iglow;
  ctx.fillRect(0, 0, s, s);

  // ── Bar chart (4 rising bars) ──
  const baseY = s * 0.78;
  const bw = s * 0.1;
  const gap = s * 0.028;
  const startX = s * 0.1;
  const heights = [s*0.2, s*0.3, s*0.4, s*0.52];

  heights.forEach((h, i) => {
    const bx = startX + i * (bw + gap);
    const by = baseY - h;

    // Bar gradient (blue to teal)
    const barG = ctx.createLinearGradient(bx, by, bx + bw, baseY);
    barG.addColorStop(0, 'rgba(30,140,255,0.9)');
    barG.addColorStop(0.5, 'rgba(20,100,220,0.8)');
    barG.addColorStop(1, 'rgba(10,60,160,0.5)');
    ctx.fillStyle = barG;
    roundedTopBar(ctx, bx, by, bw, h, s * 0.02);
    ctx.fill();

    // Bar top highlight
    ctx.fillStyle = 'rgba(100,200,255,0.35)';
    ctx.fillRect(bx + bw*0.2, by, bw*0.6, s*0.015);

    // Circuit-line detail on tall bars (only for larger sizes)
    if (size >= 48 && i >= 1) {
      ctx.strokeStyle = 'rgba(0,180,255,0.3)';
      ctx.lineWidth = s * 0.012;
      ctx.beginPath();
      ctx.moveTo(bx + bw*0.5, by + h*0.3);
      ctx.lineTo(bx + bw*0.5, by + h*0.6);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,200,255,0.5)';
      ctx.beginPath();
      ctx.arc(bx + bw*0.5, by + h*0.6, s*0.012, 0, Math.PI*2);
      ctx.fill();
    }
  });

  // ── Large diagonal arrow (from bottom-left toward upper-right) ──
  const ax1 = s * 0.08, ay1 = s * 0.82;
  const ax2 = s * 0.72, ay2 = s * 0.12;

  // Arrow glow
  ctx.save();
  ctx.strokeStyle = 'rgba(0,220,255,0.25)';
  ctx.lineWidth = s * 0.12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ax1, ay1);
  ctx.lineTo(ax2, ay2);
  ctx.stroke();
  ctx.restore();

  // Arrow line
  ctx.save();
  const arrowGrad = ctx.createLinearGradient(ax1, ay1, ax2, ay2);
  arrowGrad.addColorStop(0, 'rgba(0,180,255,0.7)');
  arrowGrad.addColorStop(0.6, 'rgba(0,220,255,1)');
  arrowGrad.addColorStop(1, 'rgba(150,240,255,1)');
  ctx.strokeStyle = arrowGrad;
  ctx.lineWidth = s * 0.045;
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(0,220,255,0.8)';
  ctx.shadowBlur = s * 0.06;
  ctx.beginPath();
  ctx.moveTo(ax1, ay1);
  ctx.lineTo(ax2, ay2);
  ctx.stroke();
  ctx.restore();

  // Arrow head (triangle)
  ctx.save();
  const angle = Math.atan2(ay2 - ay1, ax2 - ax1);
  const headLen = s * 0.14;
  ctx.translate(ax2, ay2);
  ctx.rotate(angle);
  const arrowHG = ctx.createLinearGradient(-headLen, -headLen*0.5, 0, 0);
  arrowHG.addColorStop(0, 'rgba(0,180,255,0.7)');
  arrowHG.addColorStop(1, 'rgba(180,240,255,1)');
  ctx.fillStyle = arrowHG;
  ctx.shadowColor = 'rgba(0,220,255,0.9)';
  ctx.shadowBlur = s * 0.06;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-headLen, -headLen * 0.42);
  ctx.lineTo(-headLen * 0.55, 0);
  ctx.lineTo(-headLen, headLen * 0.42);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Zigzag accent lines on arrow (M-shape / chart signal)
  if (size >= 32) {
    const zigPoints = [
      [s*0.18, s*0.7],
      [s*0.28, s*0.52],
      [s*0.38, s*0.61],
      [s*0.5, s*0.38],
      [s*0.6, s*0.45],
    ];
    ctx.save();
    ctx.strokeStyle = 'rgba(0,200,255,0.55)';
    ctx.lineWidth = s * 0.03;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(0,220,255,0.5)';
    ctx.shadowBlur = s * 0.04;
    ctx.beginPath();
    ctx.moveTo(zigPoints[0][0], zigPoints[0][1]);
    for (let i = 1; i < zigPoints.length; i++) ctx.lineTo(zigPoints[i][0], zigPoints[i][1]);
    ctx.stroke();
    // Dots on zigzag
    zigPoints.forEach(([px, py]) => {
      ctx.fillStyle = 'rgba(0,220,255,0.8)';
      ctx.beginPath();
      ctx.arc(px, py, s*0.018, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  }

  // ── Network dots (top-left area, behind F) ──
  if (size >= 48) {
    const netDots = [
      [s*0.16, s*0.22], [s*0.26, s*0.15], [s*0.3, s*0.28],
      [s*0.4, s*0.2], [s*0.22, s*0.36]
    ];
    const netLines = [[0,1],[1,2],[2,3],[0,2],[1,3],[2,4]];
    ctx.save();
    ctx.strokeStyle = 'rgba(0,200,255,0.2)';
    ctx.lineWidth = s * 0.012;
    netLines.forEach(([a,b]) => {
      ctx.beginPath();
      ctx.moveTo(netDots[a][0], netDots[a][1]);
      ctx.lineTo(netDots[b][0], netDots[b][1]);
      ctx.stroke();
    });
    netDots.forEach(([dx, dy]) => {
      ctx.fillStyle = 'rgba(0,220,255,0.5)';
      ctx.beginPath();
      ctx.arc(dx, dy, s*0.015, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  }

  // ── "F" lettermark (upper center, teal glow) ──
  const fCX = s * 0.48, fCY = s * 0.3;
  if (size >= 48) {
    // Circular halo behind F
    const fHalo = ctx.createRadialGradient(fCX, fCY, 0, fCX, fCY, s*0.18);
    fHalo.addColorStop(0, 'rgba(0,200,255,0.18)');
    fHalo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fHalo;
    ctx.beginPath();
    ctx.arc(fCX, fCY, s*0.18, 0, Math.PI*2);
    ctx.fill();
  }
  // F text
  const fSz = size >= 48 ? s * 0.28 : s * 0.32;
  ctx.save();
  ctx.font = `700 ${fSz}px 'Arial', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fGrad = ctx.createLinearGradient(fCX - fSz/2, fCY - fSz/2, fCX + fSz/2, fCY + fSz/2);
  fGrad.addColorStop(0, '#aae8ff');
  fGrad.addColorStop(0.5, '#00d4ff');
  fGrad.addColorStop(1, '#0099cc');
  ctx.fillStyle = fGrad;
  ctx.shadowColor = 'rgba(0,220,255,0.9)';
  ctx.shadowBlur = s * 0.08;
  ctx.fillText('f', fCX, fCY);
  ctx.restore();

  // ── Sparkle stars ──
  const sparkPos = [
    [s*0.82, s*0.1, s*0.022],
    [s*0.88, s*0.2, s*0.014],
    [s*0.76, s*0.06, s*0.013],
    [s*0.92, s*0.14, s*0.01],
    [s*0.08, s*0.1, s*0.013],
  ];
  sparkPos.forEach(([sx, sy, sr]) => {
    if (size < 32 && sr < s * 0.015) return;
    ctx.save();
    ctx.fillStyle = 'rgba(200,240,255,0.8)';
    ctx.shadowColor = 'rgba(0,220,255,0.8)';
    ctx.shadowBlur = s * 0.04;
    drawStar(ctx, sx, sy, sr, 4);
    ctx.fill();
    ctx.restore();
  });

  // ── "fenie" text at bottom ──
  if (size >= 48) {
    const textY = s * 0.895;
    const textSize = s * 0.155;
    ctx.save();
    ctx.font = `800 ${textSize}px 'Arial', 'Helvetica Neue', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(255,255,255,0.3)';
    ctx.shadowBlur = s * 0.02;
    ctx.fillText('fenie', s * 0.5, textY);
    ctx.restore();
  } else if (size === 32) {
    // small "f" for tiny sizes
    ctx.save();
    ctx.font = `800 ${s*0.3}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('f', s*0.5, s*0.88);
    ctx.restore();
  }

  ctx.restore(); // end clip
}

// ── Helpers ──
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function roundedTopBar(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawStar(ctx, cx, cy, r, points) {
  const step = Math.PI / points;
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const angle = i * step - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.4;
    if (i === 0) ctx.moveTo(cx + Math.cos(angle) * rad, cy + Math.sin(angle) * rad);
    else ctx.lineTo(cx + Math.cos(angle) * rad, cy + Math.sin(angle) * rad);
  }
  ctx.closePath();
}

// ── Render previews ──
const sizes = [16, 32, 48, 128];
const previews = document.getElementById('previews');

// Large preview
const bigBox = document.createElement('div');
bigBox.className = 'preview-box';
const bigCanvas = document.createElement('canvas');
bigCanvas.width = 256; bigCanvas.height = 256;
bigCanvas.style.cssText = 'width:256px;height:256px;border-radius:56px;';
drawFenie(bigCanvas.getContext('2d'), 256);
const bigLbl = document.createElement('p'); bigLbl.textContent = '256×256 preview';
bigBox.appendChild(bigCanvas); bigBox.appendChild(bigLbl);
previews.appendChild(bigBox);

sizes.forEach(size => {
  const box = document.createElement('div');
  box.className = 'preview-box';
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const disp = Math.max(size * 2, 64);
  c.style.cssText = `width:${disp}px;height:${disp}px;border-radius:${Math.round(disp*0.22)}px;image-rendering:pixelated;`;
  drawFenie(c.getContext('2d'), size);
  const lbl = document.createElement('p'); lbl.textContent = `${size}×${size}`;
  box.appendChild(c); box.appendChild(lbl);
  previews.appendChild(box);
});

// ── Download ──
document.getElementById('generate').addEventListener('click', () => {
  sizes.forEach(size => {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    drawFenie(c.getContext('2d'), size);
    const a = document.createElement('a');
    a.download = `icon${size}.png`;
    a.href = c.toDataURL('image/png');
    a.click();
  });
});
</script>
</body>
</html>
